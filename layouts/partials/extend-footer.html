{{ with resources.Get "img/footer.png" }}
  {{ $img := . | fingerprint }}
  <div class="footer-art">
    <img
      src="{{ $img.RelPermalink }}"
      alt=""
      aria-hidden="true"
      width="{{ $img.Width }}"
      height="{{ $img.Height }}"
      loading="lazy"
      decoding="async"
    />
    {{ with site.Params.footer.artCreditURL }}
      {{ $name := default "the artist" site.Params.footer.artCreditName }}
      {{ $label := printf "Footer illustration by %s" $name }}
      <a
        class="footer-art__sig"
        href="{{ . }}"
        title="{{ $label }}"
        aria-label="{{ $label }}"
        target="_blank"
        rel="noopener"
      ></a>
    {{ end }}
  </div>
{{ end }}
